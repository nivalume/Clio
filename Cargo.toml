[workspace]
resolver = "2"
members = ["crates/clio-core", "crates/clio-wasm", "crates/clio-native"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/nivalume/Clio"
rust-version = "1.89"

[workspace.dependencies]
comrak = { version = "0.56.0", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
serde-saphyr = "1.3.0"
libm = "0.2.16"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"

[profile.release-wasm]
inherits = "release"
opt-level = "s"
strip = true
