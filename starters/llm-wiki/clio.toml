# Clio knowledge base. Every key: https://clio-one.vercel.app/en/n/config
title = __TITLE_TOML__
description = ""
base = "/"                  # URL path of the site; the GitHub Pages workflow passes its own with --base
locales = __LOCALES__       # the first one is the default language
stale_days = 180            # `reviewed`/`updated` older than this gives a `stale` notice

# Built in: notes/sources/ → source, notes/concepts/ → concept, notes/entities/ → entity,
# notes/topics/ → topic, notes/questions/ → question, journal/ → journal.

